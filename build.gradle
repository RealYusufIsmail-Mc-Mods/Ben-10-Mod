plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT' apply(false)
    id 'net.neoforged.moddev.legacyforge' version '2.0.77' apply(false)
    id 'com.diffplug.spotless' version '8.10.4'
    id 'net.darkhax.curseforgegradle' version '1.1.15' apply(false)
}

repositories {
    // Spotless downloads its Eclipse formatter from here.
    mavenCentral()
}

spotless {
    java {
        target('common/src/**/*.java', 'forge/src/**/*.java', 'fabric/src/**/*.java')
        eclipse('4.19').configFile("${rootDir}/meta/formatting/google-style-eclipse.xml")
    }
}
