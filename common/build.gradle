plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

// Common code compiles against vanilla Minecraft only: any Forge or Fabric class here is a compile error.
legacyForge {
    mcpVersion = minecraft_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    // GeckoLib has no loader-neutral artifact for 1.20.1. Its API is identical in the Forge and
    // Fabric builds, so common compiles against the (remapped) Forge build; each loader then
    // compiles the same sources against its own GeckoLib.
    modCompileOnly "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
